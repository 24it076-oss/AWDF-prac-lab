<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practical 5 — MongoDB Integration with Mongoose</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #121215; --subtle: #1c1c21;
      --border: #27272a; --text: #f4f4f5; --muted: #71717a; --secondary: #a1a1aa;
      --accent: #3b82f6; --accent-sub: rgba(59,130,246,0.12);
      --green: #4DB33D; --green-sub: rgba(77,179,61,0.12); --green-border: rgba(77,179,61,0.3);
      --error: #f87171; --warn: #fbbf24; --info: #60a5fa; --ok: #34d399;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
    .hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem; }
    .logo { font-weight: 800; font-size: 1.25rem; }
    .logo span { color: var(--accent); }
    .badge-p5 { background: var(--green); color: #fff; font-size: 0.72rem; font-weight: 700;
      padding: 0.2rem 0.6rem; border-radius: 999px; margin-left: auto; }
    .page { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem; }
    .sec-hdr { display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .sec-title { font-size: 1.6rem; font-weight: 800; }
    .sec-sub { color: var(--secondary); font-size: 0.875rem; margin-top: 0.25rem; }
    .sec-tag { font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.75rem; border-radius: 999px;
      background: var(--green); color: #fff; white-space: nowrap; align-self: flex-start; margin-top: 0.4rem; }
    .pipeline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      background: #0d2a1a; border: 1px solid #2d6a4f; border-radius: 8px;
      padding: 0.6rem 1rem; margin-bottom: 1rem; font-size: 0.77rem; }
    .pipe-badge { background: var(--green); color: #fff; font-weight: 700;
      padding: 0.2rem 0.55rem; border-radius: 5px; font-size: 0.7rem; }
    .pipe-step { color: #86efac; font-family: var(--mono); }
    .btn-toggle { background: var(--subtle); border: 1px solid var(--border); color: var(--secondary);
      border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.78rem; cursor: pointer;
      font-family: var(--sans); margin-bottom: 1rem; }
    .btn-toggle:hover { border-color: var(--green); color: var(--green); }
    .schema-panel { background: var(--surface); border: 1px solid #2d6a4f;
      border-left: 3px solid var(--green); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1.25rem; overflow-x: auto; }
    .schema-title { font-size: 0.88rem; font-family: var(--mono); font-weight: 600;
      color: var(--secondary); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { text-align: left; padding: 0.4rem 0.75rem; background: var(--subtle);
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 0.38rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .f-code { font-family: var(--mono); font-size: 0.76rem; color: var(--green);
      background: var(--green-sub); padding: 0.1rem 0.3rem; border-radius: 3px; }
    .f-type { font-size: 0.7rem; font-family: var(--mono); background: var(--accent-sub);
      color: var(--accent); border-radius: 4px; padding: 0.1rem 0.35rem; }
    .grid { display: grid; grid-template-columns: 340px 1fr; gap: 1rem; margin-bottom: 1rem; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; }
    .panel-title { font-size: 0.82rem; font-family: var(--mono); font-weight: 700;
      color: var(--secondary); margin-bottom: 0.85rem; }
    .form-group { margin-bottom: 0.65rem; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--secondary); display: block; margin-bottom: 0.25rem; }
    label small { font-weight: 400; color: var(--muted); }
    input, textarea, select {
      width: 100%; background: var(--subtle); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.45rem 0.7rem; font-size: 0.82rem;
      color: var(--text); font-family: var(--sans); outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--green); }
    textarea { resize: vertical; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .err-msg { font-size: 0.7rem; color: var(--error); margin-top: 0.2rem; }
    .req { color: var(--error); }
    .btn { border: none; border-radius: 7px; cursor: pointer; font-family: var(--sans); font-weight: 600; }
    .btn-primary { background: var(--green); color: #fff; padding: 0.55rem 1rem; font-size: 0.82rem; width: 100%; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--subtle); border: 1px solid var(--border); color: var(--secondary);
      padding: 0.3rem 0.65rem; font-size: 0.75rem; }
    .btn-danger { color: var(--error); }
    .diag-section { margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--border); }
    .diag-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.4rem; display: block; }
    .filter-bar { display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .pills { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .pill { border: 1px solid var(--border); background: var(--subtle); color: var(--muted);
      border-radius: 999px; padding: 0.18rem 0.55rem; font-size: 0.72rem; cursor: pointer; }
    .pill.active { background: var(--green-sub); border-color: var(--green); color: var(--green); }
    .cards-list { display: flex; flex-direction: column; gap: 0.6rem; max-height: 480px; overflow-y: auto; }
    .card { background: var(--subtle); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 0.9rem; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
    .oid-badge { font-family: var(--mono); font-size: 0.65rem; background: var(--green-sub);
      color: var(--green); border: 1px solid var(--green-border); border-radius: 5px;
      padding: 0.1rem 0.4rem; white-space: nowrap; }
    .card-title { font-size: 0.875rem; font-weight: 700; margin-top: 0.3rem; }
    .badges { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
    .pri { font-size: 0.67rem; font-weight: 700; border-radius: 4px; padding: 0.1rem 0.4rem; }
    .pri-high { background: rgba(239,68,68,0.15); color: #f87171; }
    .pri-medium { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .pri-low { background: rgba(34,197,94,0.15); color: #4ade80; }
    .sts { font-size: 0.67rem; font-weight: 600; border-radius: 4px; padding: 0.1rem 0.4rem; }
    .sts-pending { background: rgba(156,163,175,0.15); color: #9ca3af; }
    .sts-in-progress { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .sts-completed { background: rgba(52,211,153,0.15); color: #34d399; }
    .done-badge { font-size: 0.65rem; background: rgba(52,211,153,0.15); color: #34d399;
      border: 1px solid rgba(52,211,153,0.3); border-radius: 999px; padding: 0.1rem 0.4rem; font-weight: 600; }
    .card-desc { font-size: 0.8rem; color: var(--secondary); margin-bottom: 0.35rem; }
    .tags { display: flex; gap: 0.25rem; flex-wrap: wrap; margin: 0.3rem 0; }
    .tag { font-size: 0.66rem; font-family: var(--mono); background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 0.08rem 0.35rem; color: var(--secondary); }
    .meta { display: flex; gap: 0.6rem; font-size: 0.68rem; color: var(--muted); margin-bottom: 0.45rem; flex-wrap: wrap; }
    .card-actions { display: flex; gap: 0.4rem; }
    .terminal { border: 1px solid #2d6a4f; border-radius: 10px; overflow: hidden; font-family: var(--mono); }
    .term-hdr { background: #0d2a1a; border-bottom: 1px solid #2d6a4f;
      padding: 0.55rem 1rem; display: flex; align-items: center; gap: 0.4rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-r { background: #ff5f57; } .dot-y { background: #ffbd2e; } .dot-g { background: #28c840; }
    .term-label { font-size: 0.78rem; color: var(--green); margin-left: 0.5rem; font-weight: 600; }
    .term-body { background: #071510; padding: 0.8rem 1rem; max-height: 200px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.2rem; }
    .log { font-size: 0.74rem; line-height: 1.5; }
    .log-ok { color: #34d399; } .log-info { color: #60a5fa; }
    .log-warn { color: #fbbf24; } .log-err { color: #f87171; }
    .no-docs { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const genId = () => { const h=()=>Math.floor(Math.random()*16).toString(16); const s=n=>Array.from({length:n},h).join(''); return `${s(8)}${s(4)}${s(4)}${s(4)}${s(12)}`; };
    const INIT = [
      {_id:'6726f1a2c4e3b1d0e8f9a001',title:'Complete Practical 5 Mongoose Lab Report',description:'Connect MongoDB, define schema, test all CRUD via Mongoose.',status:'In Progress',priority:'High',dueDate:'2026-11-10',isCompleted:false,tags:['mongodb','mongoose','lab'],createdAt:'2026-11-01T10:00:00Z',updatedAt:'2026-11-01T12:30:00Z'},
      {_id:'6726f1a2c4e3b1d0e8f9a002',title:'Implement JWT Authentication Middleware',description:'Add passport-jwt strategy to protect task API routes.',status:'Pending',priority:'Medium',dueDate:null,isCompleted:false,tags:['security','express'],createdAt:'2026-10-30T14:30:00Z',updatedAt:'2026-10-30T14:30:00Z'},
      {_id:'6726f1a2c4e3b1d0e8f9a003',title:'Deploy Express API to Railway',description:'Set MONGO_URI env, connect Atlas free-tier, run npm start.',status:'Completed',priority:'High',dueDate:'2026-10-28',isCompleted:true,tags:['devops','deployment','mongodb-atlas'],createdAt:'2026-10-25T09:00:00Z',updatedAt:'2026-10-28T16:00:00Z'}
    ];
    const SCHEMA=[
      {field:'title',type:'String',notes:'required, minlength: 3, maxlength: 100, trim: true',def:'—'},
      {field:'description',type:'String',notes:'trim, maxlength: 500',def:'""'},
      {field:'status',type:'String',notes:'enum: [Pending, In Progress, Completed]',def:'"Pending"'},
      {field:'priority',type:'String',notes:'enum: [Low, Medium, High]',def:'"Medium"'},
      {field:'dueDate',type:'Date',notes:'optional',def:'null'},
      {field:'isCompleted',type:'Boolean',notes:'pre-save hook: status === "Completed"',def:'false'},
      {field:'tags',type:'[String]',notes:'array of strings',def:'[]'},
      {field:'_id',type:'ObjectId',notes:'auto-generated by MongoDB',def:'auto'},
      {field:'createdAt',type:'Date',notes:'timestamps: true (auto)',def:'auto'},
      {field:'updatedAt',type:'Date',notes:'timestamps: true (auto, on each save)',def:'auto'},
    ];
    function App() {
      const [tasks,setTasks]=useState(INIT);
      const [filter,setFilter]=useState('All');
      const [showSchema,setShowSchema]=useState(true);
      const [title,setTitle]=useState('');
      const [desc,setDesc]=useState('');
      const [priority,setPriority]=useState('Medium');
      const [dueDate,setDueDate]=useState('');
      const [tags,setTags]=useState('');
      const [formErr,setFormErr]=useState('');
      const [logs,setLogs]=useState([
        {id:1,cls:'log-ok',text:'mongoose.connect("mongodb://127.0.0.1:27017/task_manager_db") → connected ✔'},
        {id:2,cls:'log-info',text:'[Mongoose] Connection readyState: 1 (connected)'},
        {id:3,cls:'log-ok',text:'Task.find({}) → 3 documents returned from collection "tasks"'},
      ]);
      const log=(text,cls='log-ok')=>{const ts=new Date().toISOString();setLogs(p=>[{id:Date.now(),cls,text:`[${ts}] ${text}`},...p.slice(0,11)]);};
      const handleCreate=e=>{
        e.preventDefault();
        if(!title.trim()||title.trim().length<3){setFormErr('Mongoose ValidationError: title must be at least 3 characters (required).');log('Task.create() → ValidationError: title fails minlength(3)','log-err');return;}
        const id=genId(),now=new Date().toISOString(),tagArr=tags.split(',').map(t=>t.trim()).filter(Boolean);
        setTasks(p=>[{_id:id,title:title.trim(),description:desc.trim()||'',status:'Pending',priority,dueDate:dueDate||null,isCompleted:false,tags:tagArr,createdAt:now,updatedAt:now},...p]);
        setTitle('');setDesc('');setTags('');setDueDate('');setFormErr('');
        log(`Task.create({ title: "${title.trim()}" }) → _id: ${id} inserted ✔`);
      };
      const handleToggle=id=>{setTasks(p=>p.map(t=>{if(t._id!==id)return t;const next=t.status==='Pending'?'In Progress':t.status==='In Progress'?'Completed':'Pending';const done=next==='Completed';log(`Task.findByIdAndUpdate("${id}",{status:"${next}",isCompleted:${done}},{runValidators:true}) → 200 OK`);return{...t,status:next,isCompleted:done,updatedAt:new Date().toISOString()};}));};
      const handleDelete=id=>{setTasks(p=>p.filter(t=>t._id!==id));log(`Task.findByIdAndDelete("${id}") → document removed`,'log-warn');};
      const filtered=filter==='All'?tasks:tasks.filter(t=>t.status===filter);
      return (
        <div>
          <div className="hdr">
            <div className="logo">R<span>.</span></div>
            <div style={{color:'#71717a',fontSize:'0.8rem'}}>Rishi | 5th Sem IT B.Tech Portfolio</div>
            <div className="badge-p5">🍃 Practical 5 — MongoDB + Mongoose</div>
          </div>
          <div className="page">
            <div className="sec-hdr">
              <div>
                <div className="sec-title">MongoDB Integration with Mongoose</div>
                <div className="sec-sub">Practical 5 — Schema design, Mongoose CRUD, ObjectId, field validation &amp; timestamps.</div>
              </div>
              <span className="sec-tag">🍃 mongoose@8 + MongoDB 7</span>
            </div>
            <div className="pipeline">
              <span className="pipe-badge">Mongoose Pipeline</span>
              <span className="pipe-step">dotenv.config()</span> →
              <span className="pipe-step">connectDB()</span> →
              <span className="pipe-step">mongoose.connect(MONGO_URI)</span> →
              <span className="pipe-step">Task Schema + Model</span> →
              <span className="pipe-step">CRUD Operations</span> →
              <span className="pipe-step">ValidationError / CastError Handler</span>
            </div>
            <button className="btn-toggle" onClick={()=>setShowSchema(v=>!v)}>
              {showSchema?'▲ Hide':'▼ Show'} Mongoose Schema Definition (models/Task.js)
            </button>
            {showSchema && (
              <div className="schema-panel">
                <div className="schema-title"><span style={{color:'#4DB33D'}}>●</span> Task Schema — <code>models/Task.js</code></div>
                <div style={{overflowX:'auto'}}>
                  <table>
                    <thead><tr><th>Field</th><th>Type</th><th>Constraints / Notes</th><th>Default</th></tr></thead>
                    <tbody>{SCHEMA.map(r=>(
                      <tr key={r.field}>
                        <td><span className="f-code">{r.field}</span></td>
                        <td><span className="f-type">{r.type}</span></td>
                        <td style={{fontSize:'0.73rem',color:'#71717a'}}>{r.notes}</td>
                        <td><code style={{fontSize:'0.71rem',fontFamily:'JetBrains Mono,monospace'}}>{r.def}</code></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            )}
            <div className="grid">
              <div className="panel">
                <div className="panel-title">Task.create() — POST /api/tasks</div>
                <form onSubmit={handleCreate} noValidate>
                  <div className="form-group">
                    <label>Title <span className="req">*</span> <small>(min 3 chars)</small></label>
                    <input value={title} onChange={e=>{setTitle(e.target.value);setFormErr('');}} placeholder="e.g. Setup MongoDB Atlas Cluster" style={formErr?{borderColor:'#f87171'}:{}} />
                    {formErr&&<div className="err-msg">{formErr}</div>}
                  </div>
                  <div className="form-group">
                    <label>Description <small>(maxlength 500)</small></label>
                    <textarea rows="2" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Technical notes..." />
                  </div>
                  <div className="two-col">
                    <div className="form-group"><label>Priority</label><select value={priority} onChange={e=>setPriority(e.target.value)}><option>Low</option><option>Medium</option><option>High</option></select></div>
                    <div className="form-group"><label>Due Date</label><input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} /></div>
                  </div>
                  <div className="form-group">
                    <label>Tags <small>(comma-separated)</small></label>
                    <input value={tags} onChange={e=>setTags(e.target.value)} placeholder="mongoose, api, lab" />
                  </div>
                  <button type="submit" className="btn btn-primary">➕ Task.create() — Insert Document</button>
                </form>
                <div className="diag-section">
                  <span className="diag-label">Mongoose Error Diagnostics:</span>
                  <button className="btn btn-secondary" style={{width:'100%',marginBottom:'0.35rem',color:'#f87171'}} onClick={()=>log('Task.create({ title: "" }) → ValidationError: Path `title` is required.','log-err')}>⚠️ Simulate ValidationError (empty title)</button>
                  <button className="btn btn-secondary" style={{width:'100%',color:'#fbbf24'}} onClick={()=>log('Task.findById("not-a-valid-id") → CastError: Cast to ObjectId failed for value "not-a-valid-id"','log-err')}>🔑 Simulate CastError (invalid ObjectId)</button>
                </div>
              </div>
              <div className="panel">
                <div className="filter-bar">
                  <div className="panel-title" style={{marginBottom:0}}>Task.find() — {filtered.length} Documents</div>
                  <div className="pills">{['All','Pending','In Progress','Completed'].map(s=><button key={s} className={`pill ${filter===s?'active':''}`} onClick={()=>setFilter(s)}>{s}</button>)}</div>
                </div>
                <div className="cards-list">
                  {filtered.length===0?<div className="no-docs">No documents match the current filter.</div>:filtered.map(t=>(
                    <div key={t._id} className="card">
                      <div className="card-top">
                        <div>
                          <div className="oid-badge" title={`ObjectId("${t._id}")`}>🍃 {t._id.slice(0,8)}…</div>
                          <div className="card-title">{t.title}</div>
                        </div>
                        <div className="badges">
                          <span className={`pri pri-${t.priority.toLowerCase()}`}>{t.priority}</span>
                          <span className={`sts sts-${t.status.toLowerCase().replace(' ','-')}`}>{t.status}</span>
                          {t.isCompleted&&<span className="done-badge">✔ isCompleted</span>}
                        </div>
                      </div>
                      {t.description&&<div className="card-desc">{t.description}</div>}
                      {t.tags&&t.tags.length>0&&<div className="tags">{t.tags.map(tg=><span key={tg} className="tag">#{tg}</span>)}</div>}
                      <div className="meta">
                        {t.dueDate&&<span>📅 {t.dueDate.slice?t.dueDate.slice(0,10):t.dueDate}</span>}
                        <span>updatedAt: {new Date(t.updatedAt).toLocaleString()}</span>
                      </div>
                      <div className="card-actions">
                        <button className="btn btn-secondary" onClick={()=>handleToggle(t._id)}>↻ Update Status</button>
                        <button className="btn btn-secondary btn-danger" onClick={()=>handleDelete(t._id)}>🗑️ Delete</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="terminal">
              <div className="term-hdr">
                <span className="dot dot-r"/> <span className="dot dot-y"/> <span className="dot dot-g"/>
                <div className="term-label">🍃 Mongoose Query Log — mongodb://127.0.0.1:27017/task_manager_db</div>
              </div>
              <div className="term-body">{logs.map(l=><div key={l.id} className={`log ${l.cls}`}>{l.text}</div>)}</div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
