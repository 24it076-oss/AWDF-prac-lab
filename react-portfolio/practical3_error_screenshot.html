<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practical 3: Loading & Error States</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <div style={{ maxWidth: '760px', margin: '0 auto', padding: '1.5rem', fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
          <div style={{ background: '#fef2f2', border: '1px dashed #ef4444', borderRadius: '8px', padding: '0.75rem 1rem', fontSize: '0.8rem', display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
            <div>
              <span style={{ background: '#dc2626', color: '#fff', padding: '0.15rem 0.5rem', borderRadius: '4px', fontWeight: 600 }}>Practical 3 Output</span>
              <strong style={{ marginLeft: '0.5rem' }}>Asynchronous State Handling &bull; Loading &amp; Error Components</strong>
            </div>
            <span style={{ color: '#dc2626', fontWeight: 600 }}>State Handling: Verified</span>
          </div>

          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '1rem', borderBottom: '1px solid #e4e4e7', marginBottom: '1.5rem' }}>
            <span style={{ fontSize: '1.5rem', fontWeight: 700 }}>R<span style={{ color: '#2563eb' }}>.</span></span>
            <nav style={{ display: 'flex', gap: '0.5rem' }}>
              <span style={{ padding: '0.35rem 0.65rem', borderRadius: '6px', fontSize: '0.85rem', color: '#71717a' }}>Home</span>
              <span style={{ padding: '0.35rem 0.65rem', borderRadius: '6px', fontSize: '0.85rem', color: '#71717a' }}>Projects</span>
              <span style={{ padding: '0.35rem 0.65rem', borderRadius: '6px', fontSize: '0.85rem', background: '#eff6ff', color: '#2563eb', fontWeight: 600 }}>Repositories (Live API)</span>
              <span style={{ padding: '0.35rem 0.65rem', borderRadius: '6px', fontSize: '0.85rem', color: '#71717a' }}>Contact</span>
            </nav>
          </header>

          {/* Section 1: Error Message Component */}
          <div style={{ marginBottom: '2rem' }}>
            <h2 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '0.75rem', color: '#18181b' }}>
              1. Error Message Component (&lt;ErrorMessage /&gt;)
            </h2>
            <div style={{ display: 'flex', gap: '1rem', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '8px', padding: '1.25rem 1.5rem' }}>
              <div style={{ fontSize: '1.5rem', lineHeight: 1 }}>⚠️</div>
              <div style={{ flex: 1 }}>
                <h3 style={{ fontSize: '1rem', fontWeight: 700, color: '#dc2626', margin: '0 0 0.35rem 0' }}>API Request Failed (404 / 403 Rate Limit)</h3>
                <p style={{ fontSize: '0.885rem', color: '#52525b', margin: '0 0 0.85rem 0' }}>
                  GitHub user "unknown-student-handle-xyz" not found (404), or public unauthenticated rate limit reached.
                </p>
                <div style={{ display: 'flex', gap: '0.6rem' }}>
                  <button style={{ background: '#18181b', color: '#fff', border: 'none', padding: '0.35rem 0.85rem', borderRadius: '6px', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer' }}>
                    ↻ Try Again
                  </button>
                  <button style={{ background: '#fff', color: '#18181b', border: '1px solid #e4e4e7', padding: '0.35rem 0.85rem', borderRadius: '6px', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer' }}>
                    Load Fallback Demo Repos
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Section 2: Loading State Component */}
          <div>
            <h2 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '0.75rem', color: '#18181b' }}>
              2. Loading Spinner &amp; Skeleton Component (&lt;LoadingSpinner /&gt;)
            </h2>
            <div style={{ background: '#fff', border: '1px solid #e4e4e7', borderRadius: '8px', padding: '1.75rem', textAlign: 'center' }}>
              <div style={{ width: '32px', height: '32px', border: '3px solid #e4e4e7', borderTopColor: '#2563eb', borderRadius: '50%', margin: '0 auto 0.75rem auto' }}></div>
              <p style={{ fontSize: '0.875rem', color: '#52525b', margin: '0 0 1.25rem 0', fontWeight: 500 }}>
                Querying GitHub REST API for @google... (isLoading: true)
              </p>
              
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', maxWidth: '520px', margin: '0 auto' }}>
                <div style={{ background: '#f4f4f5', borderRadius: '6px', padding: '1rem', textAlign: 'left' }}>
                  <div style={{ height: '14px', width: '40%', background: '#e4e4e7', borderRadius: '4px', marginBottom: '0.5rem' }}></div>
                  <div style={{ height: '10px', width: '80%', background: '#e4e4e7', borderRadius: '4px', marginBottom: '0.4rem' }}></div>
                  <div style={{ height: '10px', width: '30%', background: '#e4e4e7', borderRadius: '4px' }}></div>
                </div>
                <div style={{ background: '#f4f4f5', borderRadius: '6px', padding: '1rem', textAlign: 'left' }}>
                  <div style={{ height: '14px', width: '45%', background: '#e4e4e7', borderRadius: '4px', marginBottom: '0.5rem' }}></div>
                  <div style={{ height: '10px', width: '75%', background: '#e4e4e7', borderRadius: '4px', marginBottom: '0.4rem' }}></div>
                  <div style={{ height: '10px', width: '35%', background: '#e4e4e7', borderRadius: '4px' }}></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
