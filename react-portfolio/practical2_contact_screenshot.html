<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practical 2: Contact Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [formData, setFormData] = useState({
        name: 'Alex Sharma',
        email: 'alex.sharma@techcorp.com',
        subject: 'Internship Opportunity',
        message: 'Hi Rishi, I reviewed your 5th-semester IT portfolio. We would love to interview you for our Summer 2025 software engineering internship!'
      });

      return (
        <div style={{ maxWidth: '760px', margin: '0 auto', padding: '1.5rem', fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
          <div style={{ background: '#f4f4f5', border: '1px dashed #2563eb', borderRadius: '8px', padding: '0.75rem 1rem', fontSize: '0.8rem', display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
            <div>
              <span style={{ background: '#2563eb', color: '#fff', padding: '0.15rem 0.5rem', borderRadius: '4px', fontWeight: 600 }}>Practical 2 Output</span>
              <strong style={{ marginLeft: '0.5rem' }}>Route: /contact &bull; Controlled Form State Management</strong>
            </div>
            <span>Active Route: Contact</span>
          </div>

          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '1rem', borderBottom: '1px solid #e4e4e7', marginBottom: '1.5rem' }}>
            <span style={{ fontSize: '1.5rem', fontWeight: 700 }}>R<span style={{ color: '#2563eb' }}>.</span></span>
            <nav style={{ display: 'flex', gap: '0.5rem' }}>
              <span style={{ padding: '0.35rem 0.75rem', borderRadius: '6px', fontSize: '0.875rem', color: '#71717a' }}>Home</span>
              <span style={{ padding: '0.35rem 0.75rem', borderRadius: '6px', fontSize: '0.875rem', color: '#71717a' }}>Projects</span>
              <span style={{ padding: '0.35rem 0.75rem', borderRadius: '6px', fontSize: '0.875rem', background: '#eff6ff', color: '#2563eb', fontWeight: 600 }}>Contact (Active)</span>
            </nav>
          </header>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem' }}>
            <div>
              <h1 style={{ fontSize: '1.4rem', fontWeight: 700, margin: 0 }}>Contact Me</h1>
              <p style={{ fontSize: '0.885rem', color: '#52525b', marginTop: '0.2rem' }}>Controlled form inputs with reactive validation, character counter, and reset state.</p>
            </div>
            <span style={{ fontSize: '0.75rem', fontFamily: 'monospace', background: '#f4f4f5', padding: '0.2rem 0.5rem', borderRadius: '4px', border: '1px solid #e4e4e7' }}>Route: /contact</span>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.35fr', gap: '1.5rem' }}>
            {/* Info */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              <div style={{ background: '#fff', border: '1px solid #e4e4e7', borderRadius: '8px', padding: '1.25rem' }}>
                <h3 style={{ fontSize: '1rem', fontWeight: 700, margin: '0 0 0.5rem 0' }}>Direct Details</h3>
                <p style={{ fontSize: '0.85rem', color: '#52525b', margin: '0.3rem 0' }}><strong>Student:</strong> Rishi</p>
                <p style={{ fontSize: '0.85rem', color: '#52525b', margin: '0.3rem 0' }}><strong>Academic:</strong> B.Tech IT (5th Sem)</p>
                <p style={{ fontSize: '0.85rem', color: '#52525b', margin: '0.3rem 0' }}><strong>Email:</strong> <span style={{ fontFamily: 'monospace', color: '#2563eb' }}>rishi@example.com</span></p>
              </div>

              <div style={{ background: '#fff', border: '1px solid #e4e4e7', borderRadius: '8px', padding: '1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <strong style={{ fontSize: '0.85rem' }}>Availability FAQ (State)</strong>
                  <span style={{ fontSize: '0.7rem', color: '#2563eb', background: '#eff6ff', padding: '0.1rem 0.4rem', borderRadius: '4px' }}>Expanded</span>
                </div>
                <div style={{ marginTop: '0.5rem', fontSize: '0.8rem', color: '#52525b', background: '#f4f4f5', padding: '0.6rem', borderRadius: '4px' }}>
                  <p><strong>Available:</strong> Summer 2025/2026</p>
                  <p style={{ marginTop: '0.25rem' }}><strong>Primary Stack:</strong> React, C++, Node.js, SQL</p>
                </div>
              </div>
            </div>

            {/* Controlled Form */}
            <div style={{ background: '#fff', border: '1px solid #e4e4e7', borderRadius: '8px', padding: '1.5rem' }}>
              <h3 style={{ fontSize: '1.05rem', fontWeight: 700, margin: '0 0 1rem 0' }}>Controlled Form Input</h3>

              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.825rem', fontWeight: 600, marginBottom: '0.3rem' }}>Your Full Name *</label>
                <input
                  type="text"
                  value={formData.name}
                  readOnly
                  style={{ width: '100%', padding: '0.55rem 0.75rem', fontSize: '0.875rem', border: '1px solid #e4e4e7', borderRadius: '6px', background: '#fafafa', boxSizing: 'border-box' }}
                />
              </div>

              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.825rem', fontWeight: 600, marginBottom: '0.3rem' }}>Email Address *</label>
                <input
                  type="email"
                  value={formData.email}
                  readOnly
                  style={{ width: '100%', padding: '0.55rem 0.75rem', fontSize: '0.875rem', border: '1px solid #e4e4e7', borderRadius: '6px', background: '#fafafa', boxSizing: 'border-box' }}
                />
              </div>

              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.825rem', fontWeight: 600, marginBottom: '0.3rem' }}>Subject</label>
                <input
                  type="text"
                  value={formData.subject}
                  readOnly
                  style={{ width: '100%', padding: '0.55rem 0.75rem', fontSize: '0.875rem', border: '1px solid #e4e4e7', borderRadius: '6px', background: '#fafafa', boxSizing: 'border-box' }}
                />
              </div>

              <div style={{ marginBottom: '1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                  <label style={{ fontSize: '0.825rem', fontWeight: 600 }}>Message *</label>
                  <span style={{ fontSize: '0.72rem', fontFamily: 'monospace', color: '#71717a' }}>{formData.message.length} chars</span>
                </div>
                <textarea
                  rows="3"
                  value={formData.message}
                  readOnly
                  style={{ width: '100%', padding: '0.55rem 0.75rem', fontSize: '0.875rem', border: '1px solid #e4e4e7', borderRadius: '6px', background: '#fafafa', boxSizing: 'border-box', resize: 'none' }}
                ></textarea>
              </div>

              <div style={{ display: 'flex', gap: '0.65rem' }}>
                <button style={{ background: '#18181b', color: '#fff', border: 'none', padding: '0.55rem 1.15rem', borderRadius: '6px', fontWeight: 600, fontSize: '0.85rem', cursor: 'pointer' }}>
                  Submit Message
                </button>
                <button style={{ background: '#f4f4f5', color: '#18181b', border: '1px solid #e4e4e7', padding: '0.55rem 1rem', borderRadius: '6px', fontWeight: 600, fontSize: '0.85rem', cursor: 'pointer' }}>
                  Clear Form
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
